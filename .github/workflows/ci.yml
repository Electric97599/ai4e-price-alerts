name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Metric self tests
        run: python src/metrics.py
      - name: Panel counts match the proposal
        run: |
          python src/panel.py | tee panel_out.txt
          grep -q "1452" panel_out.txt
      - name: Fold table adds up
        run: |
          python src/folds.py | tee folds_out.txt
          grep -q "Total scored cells 1452, rises 355" folds_out.txt
      - name: Reference rules run
        run: python src/baseline.py
      - name: Reference table matches the documented counts
        run: |
          python - <<'PY'
          import pandas as pd
          table = pd.read_csv("outputs/baseline_folds.csv")
          assert list(table["cells"]) == [472, 472, 508], table["cells"].tolist()
          assert list(table["covered"]) == [270, 448, 488], table["covered"].tolist()
          assert int(table["rises"].sum()) == 355, table["rises"].sum()
          print("reference table matches the documented counts")
          PY
      - name: Demo app starts without an exception
        run: |
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('app.py', default_timeout=120).run(); assert not at.exception, at.exception"
